name: Sign Apple Shortcut

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sign-shortcut:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug Workspace Files
        run: |
          echo "Current working directory: $(pwd)"
          ls -la

      - name: Convert Plist to Binary Shortcut & Sign
        run: |
          # Convert standard text plist to binary plist format
          echo "Converting plist to binary shortcut format..."
          plutil -convert binary1 MyShortcut.plist -o MyShortcut.shortcut

          echo "Signing shortcut..."
          # Run shortcuts sign directly without interactive sudo wrappers if running as the runner user
          shortcuts sign --mode anyone --input "MyShortcut.shortcut" --output "MyShortcut_signed.shortcut"

      - name: Upload Signed Shortcut Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-shortcut
          path: MyShortcut_signed.shortcut
