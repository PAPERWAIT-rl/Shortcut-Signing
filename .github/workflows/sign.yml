name: Sign Apple Shortcut

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sign-shortcut:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Plist to Binary Shortcut & Sign
        run: |
          CONSOLE_USER=$(stat -f "%Su" /dev/console)
          CONSOLE_UID=$(id -u "$CONSOLE_USER")
          
          echo "Converting plist to binary shortcut format..."
          # Convert standard text plist to binary plist format (.shortcut files are binary plists under the hood)
          plutil -convert binary1 MyShortcut.plist -o MyShortcut.shortcut

          echo "Running shortcuts sign as user: $CONSOLE_USER ($CONSOLE_UID)"
          sudo launchctl asuser "$CONSOLE_UID" sudo -u "$CONSOLE_USER" \
            shortcuts sign --mode anyone --input "MyShortcut.shortcut" --output "MyShortcut_signed.shortcut"

      - name: Upload Signed Shortcut Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-shortcut
          path: MyShortcut_signed.shortcut
