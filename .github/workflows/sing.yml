name: Sign Apple Shortcut

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sign-shortcut:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sign Shortcut File
        run: |
          # Get the current logged-in console user UID to run the command in context
          CONSOLE_USER=$(stat -f "%Su" /dev/console)
          CONSOLE_UID=$(id -u "$CONSOLE_USER")
          
          echo "Running shortcuts sign as user: $CONSOLE_USER ($CONSOLE_UID)"
          
          # Use launchctl to run the command within a proper Aqua context
          sudo launchctl asuser "$CONSOLE_UID" sudo -u "$CONSOLE_USER" \
            shortcuts sign --mode anyone --input "MyShortcut.shortcut" --output "MyShortcut_signed.shortcut"

      - name: Upload Signed Shortcut Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-shortcut
          path: MyShortcut_signed.shortcut
